<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adopt a Fuggler</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="style.css">
  
</head>
<body>

  <header>
    <h1>Adopt a Fuggler</h1>
  </header>

  <main class="container">
    <!-- Card 1 -->
    <div class="card">
        <img src="assets/images/fuggly.jpg" alt="Fuggler Old Tooth" class="card-img">
        <div class="content">
            <h2>Old Tooth</h2>
            <p>A Laboratory Misfit with human-like teeth. Adopt if you dare!</p>
            <a href="#" class="cta-button">View</a>
        </div>
    </div>

    <!-- Card 2 -->
    <div class="card">
        <picture>
            <source srcset="assets/images/fugonnet.webp" type="image/webp">
            <img src="assets/images/fallback.jpg" alt="Fuggler Showcase" class="card-img" loading="lazy">
        </picture>
        <div class="content">
            <h2>Showcase</h2>
            <p>Optimized WebP delivery for lightning-fast performance.</p>
            <a href="#" class="cta-button">Adopt</a>
        </div>
    </div>
  </main>

  <footer>
    <p>&copy; 2024 Fuggler Collectors</p>
  </footer>

</body>
</html>
